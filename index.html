<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Kayıt Formu</title>
</head>

<body>

    <h1>Öğrenci Kayıt Formu</h1>

    <p>* ile belirtilen alanların doldurulması zorunludur.</p>

    <form method="post">

        <h2>Kişisel Bilgiler</h2>

        <div>
            <label for="ad">Ad *</label>
            <input
                type="text"
                id="ad"
                name="ad"
                autocomplete="given-name"
                required
            >
        </div>

        <br>

        <div>
            <label for="soyad">Soyad *</label>
            <input
                type="text"
                id="soyad"
                name="soyad"
                autocomplete="family-name"
                required
            >
        </div>

        <br>

        <div>
            <label for="eposta">E-posta *</label>
            <input
                type="email"
                id="eposta"
                name="eposta"
                autocomplete="email"
                required
            >
        </div>

        <br>

        <div>
            <label for="telefon">Telefon *</label>
            <input
                type="tel"
                id="telefon"
                name="telefon"
                autocomplete="tel"
                required
            >
        </div>

        <br>

        <div>
            <label for="dogum-tarihi">Doğum Tarihi *</label>
            <input
                type="date"
                id="dogum-tarihi"
                name="dogum_tarihi"
                autocomplete="bday"
                required
            >
        </div>

        <h2>Öğrenci Bilgileri</h2>

        <div>
            <label for="ogrenci-no">Öğrenci Numarası *</label>
            <input
                type="text"
                id="ogrenci-no"
                name="ogrenci_no"
                required
            >
        </div>

        <br>

        <div>
            <label for="kurum">Kayıtlı Olduğu Kurum *</label>
            <input
                type="text"
                id="kurum"
                name="kurum"
                autocomplete="organization"
                required
            >
        </div>

        <br>

        <div>
            <label for="bolum">Bölüm *</label>
            <input
                type="text"
                id="bolum"
                name="bolum"
                required
            >
        </div>

        <br>

        <div>
            <label for="sinif">Sınıf *</label>
            <input
                type="number"
                id="sinif"
                name="sinif"
                min="1"
                max="8"
                required
            >
        </div>

        <br>

        <div>
            <label for="kayit-tarihi">Kayıt Tarihi *</label>
            <input
                type="date"
                id="kayit-tarihi"
                name="kayit_tarihi"
                required
            >
        </div>

        <h2>Adres Bilgileri</h2>

        <div>
            <label for="sehir">Şehir *</label>
            <input
                type="text"
                id="sehir"
                name="sehir"
                autocomplete="address-level2"
                required
            >
        </div>

        <br>

        <div>
            <label for="ilce">İlçe *</label>
            <input
                type="text"
                id="ilce"
                name="ilce"
                autocomplete="address-level3"
                required
            >
        </div>

        <br>

        <div>
            <label for="posta-kodu">Posta Kodu</label>
            <input
                type="text"
                id="posta-kodu"
                name="posta_kodu"
                autocomplete="postal-code"
            >
        </div>

        <br>

        <div>
            <label for="adres">Adres *</label>
            <input
                type="text"
                id="adres"
                name="adres"
                maxlength="100"
                autocomplete="address-line1"
                required
            >
        </div>

        <h2>Acil Durum İletişim Bilgileri</h2>

        <div>
            <label for="acil-kisi">Acil Durumda Ulaşılacak Kişi *</label>
            <input
                type="text"
                id="acil-kisi"
                name="acil_kisi"
                required
            >
        </div>

        <br>

        <div>
            <label for="acil-telefon">Acil Durum Telefonu *</label>
            <input
                type="tel"
                id="acil-telefon"
                name="acil_telefon"
                required
            >
        </div>

        <h2>Ders Bilgileri</h2>

        <div>
            <label for="ders">İlgilenilen Ders *</label>

            <select
                id="ders"
                name="ders"
                required
            >
                <option value="">Ders seçiniz</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="frontend">Frontend Development</option>
                <option value="backend">Backend Development</option>
                <option value="veritabani">Veritabanı</option>
            </select>
        </div>

        <br>

        <fieldset>
            <legend>Deneyim Düzeyi *</legend>

            <input
                type="radio"
                id="baslangic"
                name="deneyim"
                value="baslangic"
                required
            >
            <label for="baslangic">Başlangıç</label>

            <br>

            <input
                type="radio"
                id="orta"
                name="deneyim"
                value="orta"
            >
            <label for="orta">Orta</label>

            <br>

            <input
                type="radio"
                id="ileri"
                name="deneyim"
                value="ileri"
            >
            <label for="ileri">İleri</label>
        </fieldset>

        <br>

        <fieldset>
            <legend>Öğrenim Türü *</legend>

            <input
                type="radio"
                id="orgun"
                name="ogrenim_turu"
                value="orgun"
                required
            >
            <label for="orgun">Örgün Öğretim</label>

            <br>

            <input
                type="radio"
                id="ikinci-ogretim"
                name="ogrenim_turu"
                value="ikinci-ogretim"
            >
            <label for="ikinci-ogretim">İkinci Öğretim</label>

            <br>

            <input
                type="radio"
                id="uzaktan"
                name="ogrenim_turu"
                value="uzaktan"
            >
            <label for="uzaktan">Uzaktan Öğretim</label>
        </fieldset>

        <h2>İletişim Tercihleri</h2>

        <fieldset>
            <legend>Bildirim Tercihleri</legend>

            <input
                type="checkbox"
                id="email-bildirim"
                name="bildirimler"
                value="email"
            >
            <label for="email-bildirim">
                E-posta ile bilgilendirilmek istiyorum
            </label>

            <br>

            <input
                type="checkbox"
                id="sms-bildirim"
                name="bildirimler"
                value="sms"
            >
            <label for="sms-bildirim">
                SMS ile bilgilendirilmek istiyorum
            </label>
        </fieldset>

        <h2>Mesaj</h2>

        <div>
            <label for="mesaj">Eklemek İstediğiniz Mesaj</label>
            <br>
            <textarea
                id="mesaj"
                name="mesaj"
                rows="6"
                cols="40"
                maxlength="20"
            ></textarea>
        </div>

        <br>

        <div>
            <input
                type="checkbox"
                id="kvkk"
                name="kvkk"
                value="onaylandi"
                required
            >

            <label for="kvkk">
                KVKK kapsamında kişisel verilerimin işlenmesini kabul ediyorum. *
            </label>
        </div>

        <br>

        <button type="submit">
            Başvuruyu Gönder
        </button>
        
        <button type="reset">
            Formu Temizle
        </button>

    </form>

</body>
</html>
